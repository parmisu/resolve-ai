name: API checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: resolve_ai_test
          POSTGRES_USER: resolve_ai
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U resolve_ai -d resolve_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: development
      LOG_LEVEL: INFO
      POSTGRES_DB: resolve_ai_test
      POSTGRES_USER: resolve_ai
      POSTGRES_PASSWORD: ci_test_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5433"
      DEV_API_TOKENS: "{}"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Check lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Check migration drift
        run: python -m alembic check

      - name: Run tests with coverage
        run: >-
          python -m pytest
          --cov=app
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --junitxml=test-results.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: warn